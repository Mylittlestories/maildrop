name: tests

# The whole point of this project is that the shipped thing is the source, so CI
# runs the four suites against it exactly as a reader would: install one dev
# dependency (jsdom), then `npm test`. No build step to get wrong, and nothing
# here reaches a third-party host — the suites use the local mock host, so a
# flaky provider cannot turn this red.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suites:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    name: suites on Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm i --no-audit --no-fund
      - run: npm test
