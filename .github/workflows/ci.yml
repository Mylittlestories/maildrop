name: tests

# The whole point of this project is that the shipped thing *is* the source, so CI
# runs the four suites exactly as a reader would: install one dev dependency
# (jsdom), then `npm test`. Nothing here reaches a third-party host — the suites
# use the local mock host, so provider flakiness cannot turn this badge red.
#
# Node 22 and 24 are the supported LTS lines as of 2026. 18 and 20 are past end of
# life and 18 cannot run these suites anyway (no global File before Node 20), which
# the harness says out loud rather than failing tests.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suites:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    name: suites on Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm i --no-audit --no-fund
      - run: npm test
      # The icon set is generated, so CI can insist it was regenerated before
      # it was committed. This is the one check that rasterises, hence not part
      # of `npm test` — it costs a few seconds nobody should pay per edit.
      - run: npm run icons:check
